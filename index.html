<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bybit BD PRO - Super Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#0b0e11;color:#fff} .card{background:#15191f;border:1px solid #23262f} .yellow{background:#f7a600;color:#000} .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f7a600;color:#000;padding:12px 20px;border-radius:30px;font-weight:900;font-size:13px;z-index:99999}</style>
</head>
<body class="pb-24">

<!-- HEADER -->
<div class="sticky top-0 z-30 bg-[#15191f] border-b border-[#23262f]">
<div class="flex items-center p-3 gap-2">
<button onclick="openMenu()" class="text-xl px-2">☰</button>
<div class="flex-1 relative"><input id="searchInput" oninput="searchAll()" placeholder="Search BTC, ETH, BEXIMCO, Aviator..." class="w-full bg-[#0b0e11] border border-[#23262f] rounded-full pl-9 pr-4 py-2.5 text-[13px]"><span class="absolute left-3 top-3 text-white/30">⌕</span></div>
<button onclick="openAdmin()" class="yellow px-3 py-1.5 rounded-full text-[11px] font-black">ADMIN</button>
</div>
<div class="px-3 pb-3 flex gap-2 overflow-x-auto text-[11px]"><span class="bg-[#23262f] px-3 py-1 rounded-full">🔥 BTC $67k</span><span class="bg-[#23262f] px-3 py-1 rounded-full text-[#2ebd85]">▲ DSEX +1.2%</span><span class="bg-[#23262f] px-3 py-1 rounded-full">🎮 1000+ Live Games</span></div>
</div>

<!-- BALANCE CARD - BYBIT STYLE -->
<div class="p-3">
<div class="card rounded-xl p-4">
<div class="flex justify-between"><p class="text-[11px] text-white/40">Total Equity • LIVE ●</p><span class="bg-[#f7a600] text-black text-[10px] px-2 py-0.5 rounded font-bold">VIP1 PRO</span></div>
<h1 id="totalBal" class="text-[32px] font-black mt-1">৳ 245,820.00</h1>
<p class="text-[11px] text-white/40">≈ $<span id="usdBal">2230.19</span> • Today PnL <span class="text-[#2ebd85]">+৳ <span id="pnlBal">1,240</span></span></p>
<div class="grid grid-cols-4 gap-2 mt-4">
<button onclick="openDeposit()" class="yellow py-3 rounded-lg font-black text-[13px]">Deposit</button>
<button onclick="openWithdraw()" class="card py-3 rounded-lg font-bold text-[13px]">Withdraw</button>
<button onclick="showToast('Transfer - Coming')" class="card py-3 rounded-lg font-bold text-[13px]">Transfer</button>
<button onclick="showToast('Convert - Coming')" class="card py-3 rounded-lg font-bold text-[13px]">Convert</button>
</div>
</div>
</div>

<!-- TABS -->
<div class="px-3 flex gap-5 border-b border-[#23262f] text-[13px] font-bold">
<button id="tab-coin" onclick="switchMain('coin')" class="py-3 border-b-2 border-[#f7a600]">All Coins</button>
<button id="tab-share" onclick="switchMain('share')" class="py-3 text-white/30">DSE Share</button>
<button id="tab-game" onclick="switchMain('game')" class="py-3 text-white/30">Live Games</button>
<button id="tab-bank" onclick="switchMain('bank')" class="py-3 text-white/30">My Banks</button>
</div>

<!-- CONTENT -->
<div class="p-3">
<div id="view-coin" class="space-y-1"></div>
<div id="view-share" class="hidden space-y-1"></div>
<div id="view-game" class="hidden grid grid-cols-3 gap-2"></div>
<div id="view-bank" class="hidden space-y-2"></div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 w-full bg-[#15191f] border-t border-[#23262f] flex justify-around py-2.5 text-[10px] font-bold text-white/40">
<button onclick="switchMain('coin')" class="text-[#f7a600]">Markets</button>
<button onclick="switchMain('share')">Trade</button>
<button onclick="switchMain('bank')">Assets</button>
<button onclick="openMenu()">Menu</button>
<button onclick="openAdmin()">Admin</button>
</div>

<!-- MENU DRAWER -->
<div id="menuDrawer" class="hidden fixed inset-0 z-[60] flex">
<div class="bg-[#15191f] w-[85%] h-full p-4 overflow-y-auto"><div class="flex justify-between"><h2 class="font-black">1000+ Options</h2><button onclick="closeMenu()" class="text-xl">✕</button></div><div id="menuGrid" class="grid grid-cols-2 gap-2 mt-4 text-[11px]"></div></div>
<div class="flex-1 bg-black/60" onclick="closeMenu()"></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4">
<div class="bg-[#15191f] border border-[#23262f] w-full max-w-sm rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
<h2 class="font-black text-[#f7a600]">ADMIN CONTROL</h2>
<div class="mt-4 space-y-3">
<input id="adminBkashInput" placeholder="Your bKash Number" value="017XXXXXXXX" class="w-full bg-[#0b0e11] border border-[#23262f] p-3 rounded-lg text-sm">
<input id="adminNagadInput" placeholder="Your Nagad Number" value="018XXXXXXXX" class="w-full bg-[#0b0e11] border border-[#23262f] p-3 rounded-lg text-sm">
<button onclick="saveAdmin()" class="w-full yellow py-3 rounded-lg font-black">SAVE BKASH NUMBER</button>
</div>
<div class="mt-6 border-t border-[#23262f] pt-4"><h3 class="font-bold text-sm">Pending Deposits (TrxID)</h3><div id="pendingBox" class="mt-3 space-y-2"></div></div>
<button onclick="closeAdmin()" class="w-full card py-3 rounded-lg mt-4">Close</button>
</div>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="hidden fixed inset-0 z-[80] bg-black/80 flex items-end">
<div class="bg-[#15191f] w-full rounded-t-2xl p-5 border-t border-[#23262f]">
<h3 class="font-black">Deposit - bKash</h3>
<div class="bg-[#0b0e11] border border-[#f7a600]/30 p-3 rounded-xl mt-3 text-[12px]">
<p>Send Money To:</p><p class="font-black text-[15px] mt-1">bKash: <span id="displayBkash">017XXXXXXXX</span></p><p class="font-black text-[15px]">Nagad: <span id="displayNagad">018XXXXXXXX</span></p><p class="text-[#f7a600] text-[11px] mt-2">টাকা পাঠিয়ে TrxID দিন, অ্যাডমিন Approve করবে</p>
</div>
<input id="depAmt" type="number" placeholder="Amount ৳ (e.g. 5000)" class="w-full mt-3 bg-[#0b0e11] border border-[#23262f] p-3.5 rounded-xl">
<input id="depTrx" placeholder="Transaction ID - TrxID" class="w-full mt-2 bg-[#0b0e11] border border-[#23262f] p-3.5 rounded-xl">
<input id="depPhone" placeholder="আপনার নাম্বার" class="w-full mt-2 bg-[#0b0e11] border border-[#23262f] p-3.5 rounded-xl">
<button onclick="submitDeposit()" class="w-full yellow py-4 rounded-xl font-black mt-4">SUBMIT TRXID</button>
<button onclick="closeDeposit()" class="w-full card py-3 rounded-xl mt-2">Cancel</button>
</div>
</div>

<script>
let total=245820;
let adminBkash="017XXXXXXXX", adminNagad="018XXXXXXXX";
let pendingDeposits=[];
let coins=[
{BTC:67234},{ETH:3421},{SOL:178},{BNB:612},{XRP:0.58},{DOGE:0.14},{ADA:0.45},{SHIB:0.00002},{PEPE:0.000008},{BONK:0.00003},{USDT:1},{AVAX:34},{TRX:0.12},{LINK:14},{MATIC:0.8},{LTC:72},{DOT:6.5},{UNI:7.2},{FLOKI:0.0002},{WIF:2.1}
].map(o=>{let k=Object.keys(o)[0]; return {sym:k, price:o[k]}});
let shares=[{n:'BEXIMCO',p:125.4},{n:'BRAC Bank',p:42.2},{n:'SQURPHARMA',p:210},{n:'GP',p:285},{n:'IBBL',p:32.1},{n:'Walton',p:890},{n:'BATBC',p:320},{n:'City Bank',p:22}];
let games=['Aviator','Crash','Mines','Dice','Plinko','Wheel','Limbo','Keno','JetX','Spaceman','Cricket','Football','Ludo','Poker','Roulette','Blackjack','Slots','Dragon Tiger','Andar Bahar','Aviatrix'];
let banks=[{name:'BRAC Bank',bal:52420},{name:'IBBL - Halal',bal:75200},{name:'DBBL',bal:18500},{name:'City Bank',bal:34000},{name:'bKash',bal:12700},{name:'Nagad',bal:8500}];

function render(){
document.getElementById('view-coin').innerHTML=coins.map(c=>{
let ch=(Math.random()*4-2).toFixed(2); let up=ch>=0;
return `<div class="card p-3 rounded-xl flex justify-between items-center"><div class="flex gap-3 items-center"><div class="w-8 h-8 rounded-full bg-[#23262f] flex items-center justify-center font-black text-[11px]">${c.sym[0]}</div><div><p class="font-bold text-[13px]">${c.sym}</p><p class="text-[10px] text-white/40">${c.sym}/USDT</p></div></div><div class="text-right"><p class="font-bold text-[13px]">$${(c.price*(1+ch/100)).toFixed(4)}</p><p class="text-[11px] ${up?'text-[#2ebd85]':'text-[#ef454a]'}">${up?'▲':'▼'} ${Math.abs(ch)}%</p></div></div>`;
}).join('');

document.getElementById('view-share').innerHTML=shares.map(s=>{
let ch=(Math.random()*3-1.5).toFixed(2);
return `<div class="card p-3 rounded-xl flex justify-between"><span class="font-bold text-[13px]">${s.n}</span><span class="text-[13px]">৳ ${(s.p*(1+ch/100)).toFixed(2)} <span class="${ch>=0?'text-[#2ebd85]':'text-[#ef454a]'}">${ch>=0?'+':''}${ch}%</span></span></div>`;
}).join('');

document.getElementById('view-game').innerHTML=games.map(g=>`<div onclick="showToast('${g} Live Opening...')" class="card p-3 rounded-xl text-center cursor-pointer"><div class="h-12 bg-[#0b0e11] rounded-lg flex items-center justify-center">🎮</div><p class="font-bold text-[11px] mt-2">${g}</p><p class="text-[9px] text-[#2ebd85]">● LIVE</p></div>`).join('');

document.getElementById('view-bank').innerHTML=banks.map(b=>`<div class="card p-4 rounded-xl flex justify-between"><div><p class="font-bold text-[13px]">${b.name}</p><p class="text-[10px] text-white/40">****4521 • Available</p></div><p class="font-bold">৳ ${b.bal.toLocaleString()}</p></div>`).join('');

document.getElementById('menuGrid').innerHTML=[...coins.map(c=>c.sym+' Trade'),...shares.map(s=>s.n+' Trade'),...games].map(x=>`<div onclick="showToast('${x}')" class="card p-2.5 rounded-lg text-center">${x}</div>`).join('');

document.getElementById('pendingBox').innerHTML=pendingDeposits.length?pendingDeposits.map((p,i)=>`<div class="bg-[#0b0e11] p-3 rounded-xl border border-[#23262f]"><p class="font-bold">৳ ${p.amt} • Trx: ${p.trx}</p><p class="text-[11px] text-white/40">${p.phone}</p><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="approveDep(${i})" class="bg-[#2ebd85] text-black py-2 rounded-lg font-bold">Approve</button><button onclick="rejectDep(${i})" class="bg-[#ef454a] py-2 rounded-lg font-bold">Reject</button></div></div>`).join(''):'<p class="text-white/30 text-xs">No pending deposit</p>';

document.getElementById('totalBal').innerText='৳ '+total.toLocaleString(); document.getElementById('usdBal').innerText=(total/110).toFixed(2);
document.getElementById('displayBkash').innerText=adminBkash; document.getElementById('displayNagad').innerText=adminNagad;
}

function switchMain(id){
['coin','share','game','bank'].forEach(v=>{document.getElementById('view-'+v).classList.add('hidden'); document.getElementById('tab-'+v).className='py-3 text-white/30';});
document.getElementById('view-'+id).classList.remove('hidden'); document.getElementById('tab-'+id).className='py-3 border-b-2 border-[#f7a600]';
}
function openMenu(){document.getElementById('menuDrawer').classList.remove('hidden');}
function closeMenu(){document.getElementById('menuDrawer').classList.add('hidden');}
function openAdmin(){document.getElementById('adminPanel').classList.remove('hidden');}
function closeAdmin(){document.getElementById('adminPanel').classList.add('hidden');}
function saveAdmin(){adminBkash=document.getElementById('adminBkashInput').value; adminNagad=document.getElementById('adminNagadInput').value; render(); showToast('bKash Saved: '+adminBkash); closeAdmin();}
function openDeposit(){document.getElementById('depositModal').classList.remove('hidden');}
function closeDeposit(){document.getElementById('depositModal').classList.add('hidden');}
function openWithdraw(){showToast('Withdraw - Admin Approval Needed');}
function submitDeposit(){
let amt=parseInt(document.getElementById('depAmt').value||0); let trx=document.getElementById('depTrx').value; let phone=document.getElementById('depPhone').value;
if(!amt||!trx) return showToast('Amount ও TrxID দিন ভাই');
pendingDeposits.push({amt,trx,phone}); closeDeposit(); render(); showToast('TrxID Sent to Admin: '+trx);
document.getElementById('depAmt').value=''; document.getElementById('depTrx').value='';
}
function approveDep(i){let p=pendingDeposits[i]; total+=p.amt; pendingDeposits.splice(i,1); render(); showToast('Approved ৳'+p.amt);}
function rejectDep(i){pendingDeposits.splice(i,1); render(); showToast('Rejected');}
function searchAll(){
let q=document.getElementById('searchInput').value.toLowerCase();
if(!q) return render();
let fCoins=coins.filter(c=>c.sym.toLowerCase().includes(q));
document.getElementById('view-coin').innerHTML=fCoins.map(c=>`<div class="card p-3 rounded-xl">${c.sym} - $${c.price}</div>`).join('')||'<p class="text-white/30 text-xs">Not found</p>';
switchMain('coin');
}
function showToast(m){let t=document.createElement('div');t.className='toast';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
setInterval(()=>{coins.forEach(c=>c.price*=1+(Math.random()-0.5)/300); if(!document.getElementById('view-coin').classList.contains('hidden')) render();},2500);
render();
</script>
</body>
</html>

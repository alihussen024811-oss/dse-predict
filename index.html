<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit - Assets</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0c0e12;color:#fff;font-family: -apple-system, BlinkMacSystemFont, sans-serif;}
.card{background:#15181f;border:1px solid #1f232e;}
.nav-active{color:#f7a600!important}
</style>
</head>
<body class="pb-[70px]">
<div class="bg-[#15181f] border-b border-[#1f232e] px-4 py-3 flex justify-between items-center">
<span class="text-[#f7a600] font-black text-[16px]">BYBIT <span class="text-[10px] bg-[#1f232e] text-white/40 px-1.5 py-0.5 rounded">PRO-BD</span></span>
<span class="text-[11px] text-white/40">UID 1088***23 <span class="bg-[#f7a600] text-black px-2 py-0.5 rounded font-bold ml-1">VIP1</span></span>
</div>

<!-- VIEWS -->
<div id="view-assets">
<div class="p-4">
<p class="text-[12px] text-white/40">Total Equity</p>
<h1 id="totalText" class="text-[30px] font-bold mt-1">৳ 245,820.00</h1>
<p class="text-[11px] text-white/40 mt-1">≈ $<span id="usdText">2,230.19</span> • Today's PnL <span class="text-[#2ebd85]">+৳ <span id="pnlText">1,240.00</span></span></p>
<div class="grid grid-cols-4 gap-2 mt-4">
<button onclick="openAction('deposit')" class="bg-[#f7a600] text-black py-[10px] rounded-[6px] text-[13px] font-bold">Deposit</button>
<button onclick="openAction('withdraw')" class="card py-[10px] rounded-[6px] text-[13px]">Withdraw</button>
<button onclick="openAction('transfer')" class="card py-[10px] rounded-[6px] text-[13px]">Transfer</button>
<button onclick="openAction('convert')" class="card py-[10px] rounded-[6px] text-[13px]">Convert</button>
</div>
</div>
<div class="px-4 flex gap-6 border-b border-[#1f232e] text-[13px]"><span class="py-2.5 border-b-2 border-[#f7a600] font-bold">Funding</span><span class="py-2.5 text-white/30">Unified</span><span class="py-2.5 text-white/30">Inverse</span></div>
<div class="p-4">
<p class="text-[13px] font-bold">My Banks & Wallets</p>
<div id="bankList" class="mt-3 rounded-[8px] overflow-hidden border border-[#1f232e]"></div>
</div>
</div>

<div id="view-home" class="hidden p-4"><h2 class="font-bold">Home</h2><div class="card p-4 rounded-lg mt-3 text-sm text-white/60">DSE Predict Home - এখানে মার্কেট ওভারভিউ আসবে</div></div>
<div id="view-markets" class="hidden p-4"><h2 class="font-bold">Markets</h2><div id="mList" class="mt-3 space-y-2"></div></div>
<div id="view-trade" class="hidden p-4"><h2 class="font-bold">Trade</h2><div class="card p-6 mt-3 rounded-lg text-center"><p class="text-sm">BEXIMCO / BDT</p><p class="text-2xl font-bold mt-1">৳ 125.40</p><div class="grid grid-cols-2 gap-2 mt-6"><button onclick="doTrade(1)" class="bg-[#2ebd85] py-3 rounded-lg font-bold">BUY</button><button onclick="doTrade(-1)" class="bg-[#f6465d] py-3 rounded-lg font-bold">SELL</button></div></div></div>
<div id="view-more" class="hidden p-4"><h2 class="font-bold">More</h2><div class="card p-4 rounded-lg mt-3 text-sm">Settings • Language • Halal Mode • Support</div></div>

<div class="fixed bottom-0 w-full bg-[#15181f] border-t border-[#1f232e] flex justify-around py-2 text-[11px] text-white/40">
<button onclick="nav('home')" id="b-home">Home</button>
<button onclick="nav('markets')" id="b-markets">Markets</button>
<button onclick="nav('trade')" id="b-trade">Trade</button>
<button onclick="nav('assets')" id="b-assets" class="nav-active font-bold">Assets</button>
<button onclick="nav('more')" id="b-more">More</button>
</div>

<!-- ACTION MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-end">
<div class="bg-[#15181f] w-full rounded-t-[16px] p-5 border-t border-[#1f232e]">
<h3 id="modalTitle" class="font-bold text-[16px]">Deposit</h3>
<select id="bankSelect" class="w-full mt-4 bg-[#0c0e12] border border-[#1f232e] p-3 rounded-lg text-[13px]"></select>
<input id="amountInput" type="number" placeholder="Amount" class="w-full mt-3 bg-[#0c0e12] border border-[#1f232e] p-3 rounded-lg text-[14px]">
<div class="grid grid-cols-3 gap-2 mt-3"><button onclick="setAmount(1000)" class="card py-2 rounded text-xs">৳1,000</button><button onclick="setAmount(5000)" class="card py-2 rounded text-xs">৳5,000</button><button onclick="setAmount(10000)" class="card py-2 rounded text-xs">৳10,000</button></div>
<button onclick="confirmAction()" class="w-full mt-5 bg-[#f7a600] text-black py-3.5 rounded-lg font-bold text-[14px]">Confirm</button>
<button onclick="closeModal()" class="w-full mt-2 card py-3 rounded-lg text-[13px]">Cancel</button>
</div>
</div>

<script>
let total = 245820;
let banks = [
  {name:'BRAC Bank - Savings', acc:'***4521 • Available', bal:52420},
  {name:'Islami Bank Bangladesh', acc:'***1023 • Halal', bal:75200},
  {name:'Dutch-Bangla Bank', acc:'***8890 • Available', bal:18500},
  {name:'City Bank - Current', acc:'***3341 • Available', bal:34000},
  {name:'bKash Personal', acc:'01*** 556677 • Available', bal:12700},
  {name:'Nagad Personal', acc:'01*** 556677 • Available', bal:8500},
];
let currentAction = 'deposit';

function render(){
  let html = ''; let sel = '';
  banks.forEach((b,i)=>{
    html += `<div onclick="openAction('transfer',${i})" class="bg-[#15181f] p-3 flex justify-between items-center border-b border-[#1f232e] last:border-0"><div><p class="text-[13px] font-medium">${b.name}</p><p class="text-[11px] text-white/40 mt-0.5">${b.acc}</p></div><div class="text-right"><p class="text-[13px] font-medium">৳ ${b.bal.toLocaleString()}</p><p class="text-[10px] text-white/40">$ ${(b.bal/110).toFixed(2)}</p></div></div>`;
    sel += `<option value="${i}">${b.name} - ৳ ${b.bal.toLocaleString()}</option>`;
  });
  document.getElementById('bankList').innerHTML = html;
  document.getElementById('bankSelect').innerHTML = sel;
  document.getElementById('totalText').innerText = '৳ ' + total.toLocaleString('en-US',{minimumFractionDigits:2});
  document.getElementById('usdText').innerText = (total/110).toFixed(2);
  document.getElementById('mList').innerHTML = banks.map(b=>`<div class="card p-3 rounded-lg flex justify-between text-[13px]"><span>${b.name}</span><span>৳ ${b.bal}</span></div>`).join('');
}
function nav(id){
  ['assets','home','markets','trade','more'].forEach(v=>{document.getElementById('view-'+v).classList.add('hidden'); document.getElementById('b-'+v).classList.remove('nav-active');});
  document.getElementById('view-'+id).classList.remove('hidden');
  document.getElementById('b-'+id).classList.add('nav-active');
}
function openAction(type, idx){
  currentAction = type;
  document.getElementById('modalTitle').innerText = type.charAt(0).toUpperCase() + type.slice(1) + ' - Select Bank';
  if(idx !== undefined) document.getElementById('bankSelect').value = idx;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden'); document.getElementById('amountInput').value='';}
function setAmount(v){document.getElementById('amountInput').value=v;}
function confirmAction(){
  let amt = parseInt(document.getElementById('amountInput').value || 0);
  let bankIdx = parseInt(document.getElementById('bankSelect').value || 0);
  if(!amt || amt <=0) return alert('Amount লিখুন');
  if(currentAction === 'deposit'){ banks[bankIdx].bal += amt; total += amt; }
  if(currentAction === 'withdraw'){ if(banks[bankIdx].bal < amt) return alert('এই ব্যাংকে পর্যাপ্ত ব্যালেন্স নেই'); banks[bankIdx].bal -= amt; total -= amt; }
  if(currentAction === 'transfer'){ if(banks[bankIdx].bal < amt) return alert('ব্যালেন্স কম'); /* just toast */ }
  if(currentAction === 'convert'){ /* just toast */ }
  render(); closeModal();
}
function doTrade(dir){
  total += dir * 1000;
  document.getElementById('pnlText').innerText = (Math.random()*2000).toFixed(2);
  render();
  alert(dir>0 ? 'BUY Order Success' : 'SELL Order Success');
}
render();
</script>
</body>
</html>

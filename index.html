<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSE Wallet - Bybit PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0b0e11;color:#fff} .card{background:#15191f;border:1px solid #ffffff0f;border-radius:14px} .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f7a600;color:#000;padding:10px 18px;border-radius:999px;font-weight:900;font-size:13px;z-index:9999}</style>
</head>
<body class="pb-28">
<header class="p-4 bg-[#15191f] flex justify-between border-b border-white/10">
<div><p class="text-white/50 text-[11px]">Total Assets • মোট সম্পদ</p><h1 id="total" class="text-3xl font-black mt-1">৳ 2,45,820</h1><p class="text-xs text-white/40">= <span id="usdt">2,230.45</span> USDT • <span class="text-emerald-400">Today +৳ <span id="pnl">1,240</span></span></p></div>
<div class="text-right"><span class="bg-[#f7a600] text-black px-3 py-1.5 rounded font-black text-xs">PRO</span></div>
</header>

<div class="p-3 grid grid-cols-3 gap-2 text-center text-xs">
<div class="card p-3"><p class="text-white/40">Spot</p><b>৳ 85k</b></div>
<div class="card p-3"><p class="text-white/40">Funding</p><b>৳ 1,20k</b></div>
<div class="card p-3 border-[#f7a600]/50 bg-[#f7a600]/5"><p class="text-[#f7a600]">Futures</p><b>৳ 40k</b></div>
</div>

<div class="p-3 space-y-2" id="banks">
<!-- Banks will be rendered by JS -->
</div>

<div class="p-3 grid grid-cols-2 gap-2">
<button onclick="doDeposit()" class="bg-[#f7a600] text-black py-4 rounded-xl font-black text-sm">Deposit • টাকা ঢুকান</button>
<button onclick="doWithdraw()" class="bg-white/10 py-4 rounded-xl font-bold text-sm">Withdraw • তুলুন</button>
</div>

<div class="px-4 text-[11px] text-white/30">* Demo Balance - টেস্টের জন্য, আসল ব্যাংক কানেক্ট না</div>

<nav class="fixed bottom-0 w-full bg-[#15191f] border-t border-white/10 flex justify-around py-3 text-[11px] font-bold">
<button onclick="showToast('Markets শীঘ্রই আসছে')">Markets</button>
<button onclick="showToast('Trade টার্মিনাল শীঘ্রই')">Trade</button>
<button class="text-[#f7a600]">Wallet</button>
<button onclick="showToast('Futures Prediction কাল আসবে')">Futures</button>
<button onclick="showToast('Academy ভিডিও আসছে')">Academy</button>
</nav>

<div id="modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
<div class="card p-5 w-full max-w-sm">
<h3 id="modalTitle" class="font-black text-lg">Deposit</h3>
<p class="text-xs text-white/50 mt-1">কত টাকা?</p>
<input id="amt" type="number" placeholder="যেমন 5000" class="w-full mt-3 bg-[#0b0e11] border border-white/10 p-3 rounded-xl text-white">
<div class="grid grid-cols-3 gap-2 mt-3 text-xs"><button onclick="setAmt(1000)" class="bg-white/10 py-2 rounded">1000</button><button onclick="setAmt(5000)" class="bg-white/10 py-2 rounded">5000</button><button onclick="setAmt(10000)" class="bg-white/10 py-2 rounded">10000</button></div>
<div class="grid grid-cols-2 gap-2 mt-4"><button onclick="closeModal()" class="bg-white/10 py-3 rounded-xl">বাতিল</button><button id="modalAction" class="bg-[#f7a600] text-black py-3 rounded-xl font-black">Confirm</button></div>
</div>
</div>

<script>
let total = 245820;
let banks = [
 {id:'brac', name:'BRAC Bank', acc:'**** 4521', bal:52420, color:'#0a2a7a'},
 {id:'dbbl', name:'DBBL / Rocket', acc:'**** 8890', bal:18500, color:'#e4002b'},
 {id:'ibbl', name:'Islami Bank ✓ Halal', acc:'**** 1023', bal:75200, color:'#00a651'},
 {id:'city', name:'City Bank', acc:'**** 3341', bal:34000, color:'#ff6a00'},
 {id:'bkash', name:'bKash', acc:'01*** 556677', bal:12700, color:'#e2136e'},
 {id:'nagad', name:'Nagad', acc:'01*** 556677', bal:8500, color:'#ff5a00'},
];

function render(){
 let html='';
 banks.forEach(b=>{
   html+=`<div onclick="bankClick('${b.id}')" class="card p-3 flex justify-between items-center cursor-pointer active:scale-[0.98] transition"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-xs" style="background:${b.color}">${b.name.substring(0,4)}</div><div><b class="text-sm">${b.name}</b><br><span class="text-[11px] text-white/40">${b.acc}</span></div></div><div class="text-right"><b class="text-sm">৳ ${b.bal.toLocaleString()}</b><br><span class="text-[11px] text-white/40">Tap</span></div></div>`;
 });
 document.getElementById('banks').innerHTML=html;
 document.getElementById('total').innerText='৳ '+total.toLocaleString();
 document.getElementById('usdt').innerText=(total/110).toFixed(2);
}

function showToast(msg){
 let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t);
 setTimeout(()=>t.remove(),2500);
}

let mode='deposit';
function doDeposit(){mode='deposit'; document.getElementById('modalTitle').innerText='Deposit • টাকা ঢুকান'; document.getElementById('modalAction').innerText='Deposit Confirm'; document.getElementById('modalAction').onclick=confirmAction; document.getElementById('modal').classList.remove('hidden');}
function doWithdraw(){mode='withdraw'; document.getElementById('modalTitle').innerText='Withdraw • টাকা তুলুন'; document.getElementById('modalAction').innerText='Withdraw Confirm'; document.getElementById('modalAction').onclick=confirmAction; document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden'); document.getElementById('amt').value='';}
function setAmt(v){document.getElementById('amt').value=v;}
function confirmAction(){
 let amt=parseInt(document.getElementById('amt').value||0);
 if(amt<=0){showToast('টাকার পরিমাণ লিখুন'); return;}
 if(mode==='deposit'){ total+=amt; banks[0].bal+=amt; showToast('✅ ৳'+amt+' Deposit সফল!'); }
 else { if(total<amt){showToast('❌ ব্যালেন্স কম'); return;} total-=amt; showToast('✅ ৳'+amt+' Withdraw সফল!'); }
 document.getElementById('pnl').innerText= (Math.floor(Math.random()*2000)+500);
 render(); closeModal();
}
function bankClick(id){
 let b=banks.find(x=>x.id===id);
 showToast(b.name+': ৳'+b.bal.toLocaleString()+' - বিস্তারিত আসছে');
}
render();
</script>
</body>
</html>

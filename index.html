<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MELBET BD PRO - ALL OPTIONS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0b0e11;color:#fff} .card{background:#15191f;border:1px solid #23262f} .yellow{background:#f7a600;color:#000} .modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:flex;align-items:flex-end} .modal-c{width:100%;background:#15191f;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto} .modal-center{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:15px}</style>
</head>
<body>
<!-- AUTH + OTP SAME AS BEFORE -->
<div id="authScreen" class="fixed inset-0 z-[200] bg-[#0b0e11] flex items-center justify-center p-4"><div class="w-full max-w-sm"><h1 class="text-[28px] font-black text-center">MELBET <span class="text-[#f7a600]">BD PRO</span></h1><p class="text-center text-[11px] text-white/40">OTP Registration + All Options</p><div id="customerAuth" class="mt-6 space-y-3"><input id="cPhone" placeholder="01XXXXXXXXX" class="w-full bg-[#15191f] border border-[#23262f] p-4 rounded-xl"><input id="cPass" type="password" placeholder="Password" class="w-full bg-[#15191f] border border-[#23262f] p-4 rounded-xl"><button onclick="customerSignup()" class="w-full yellow py-4 rounded-xl font-black">SIGN UP - OTP</button><button onclick="customerLogin()" class="w-full card py-4 rounded-xl font-bold">LOGIN</button></div><div id="adminAuth" class="hidden mt-6"><input id="aPass" type="password" placeholder="BdPro@2026" class="w-full bg-[#15191f] p-4 rounded-xl text-center"><button onclick="adminLogin()" class="w-full yellow py-4 rounded-xl font-black mt-3">ADMIN</button></div></div></div>

<div id="otpModal" class="hidden modal-center"><div class="bg-[#15191f] w-full max-w-sm p-6 rounded-2xl"><h2 class="font-black text-center">OTP Verification</h2><p id="demoOtpShow" class="text-[36px] font-black text-[#f7a600] text-center tracking-[10px] mt-3">000000</p><p id="otpPhoneShow" class="text-center text-[11px] text-white/40"></p><input id="otpInput" placeholder="OTP" class="w-full bg-[#0b0e11] border border-[#23262f] p-4 rounded-xl mt-4 text-center text-[20px]"><button onclick="verifyOtp()" class="w-full yellow py-4 rounded-xl font-black mt-3">CONFIRM</button><button onclick="closeOtp()" class="w-full card py-3 rounded-xl mt-2">Cancel</button></div></div>

<div class="sticky top-0 z-20 bg-[#15191f] border-b border-[#23262f] p-3 flex justify-between items-center"><div class="flex gap-2 items-center"><div id="userAvatar" class="w-8 h-8 rounded-full bg-[#f7a600] text-black font-black flex items-center justify-center">C</div><div><p id="userPhoneShow" class="font-bold text-[12px]"></p><p class="text-[9px] text-[#2ebd85]">● LIVE</p></div></div><div class="flex gap-2"><button onclick="openAdmin()" id="adminTopBtn" class="hidden yellow px-3 py-2 rounded-full text-[10px] font-black">ADMIN</button><button onclick="logout()" class="card px-3 py-2 rounded-full text-[10px]">Logout</button></div></div>

<div class="p-3"><div class="card rounded-2xl p-4 flex justify-between"><div><p class="text-[10px] text-white/40">Balance</p><h1 id="balShow" class="text-[26px] font-black">৳ 0</h1></div><div class="flex flex-col gap-2"><button onclick="openDeposit()" class="yellow px-5 py-2 rounded-full text-[12px] font-black">Deposit</button><button onclick="openWithdraw()" class="card px-5 py-2 rounded-full text-[12px]">Withdraw</button></div></div></div>

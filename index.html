<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit | My Assets</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans',sans-serif;background:#0c0e12} .bybit-card{background:#15181f;border:1px solid #22252e} .bybit-yellow{color:#f7a600} .bybit-bg-yellow{background:#f7a600}</style>
</head>
<body class="text-white">

<!-- Header like Bybit -->
<div class="bg-[#15181f] border-b border-[#22252e] px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-2"><span class="text-[#f7a600] font-black text-xl">BYBIT</span><span class="text-[11px] bg-[#22252e] px-2 py-0.5 rounded text-white/50">PRO • BD</span></div>
<div class="flex gap-3 text-[11px]"><span class="text-white/40">UID: 1088****23</span><span class="bg-[#f7a600] text-black px-2 py-0.5 rounded font-bold">VIP1</span></div>
</div>

<!-- Total Assets - Exact Bybit Style -->
<div class="p-4">
<p class="text-[12px] text-[#8b8f9c]">Total Equity</p>
<div class="flex items-baseline gap-2 mt-1">
<h1 id="totalEq" class="text-[32px] font-bold leading-none tracking-tight">৳ 2,45,820.45</h1>
<span class="text-[12px] text-[#20b26c] bg-[#20b26c]/10 px-2 py-0.5 rounded">+2.43%</span>
</div>
<p class="text-[12px] text-[#8b8f9c] mt-1">≈ $2,230.19 • Today’s PnL <span class="text-[#20b26c]">+৳ 1,240.00 (+0.52%)</span></p>

<!-- Buttons like Bybit -->
<div class="grid grid-cols-4 gap-2 mt-4">
<button onclick="action('deposit')" class="bybit-bg-yellow text-black py-2.5 rounded text-[13px] font-bold">Deposit</button>
<button onclick="action('withdraw')" class="bybit-card py-2.5 rounded text-[13px] font-medium">Withdraw</button>
<button onclick="action('transfer')" class="bybit-card py-2.5 rounded text-[13px] font-medium">Transfer</button>
<button onclick="action('convert')" class="bybit-card py-2.5 rounded text-[13px] font-medium">Convert</button>
</div>
</div>

<!-- Account Tabs -->
<div class="px-4 flex gap-5 border-b border-[#22252e] text-[13px]">
<button class="py-3 border-b-2 border-[#f7a600] font-bold">Funding</button>
<button class="py-3 text-[#8b8f9c]">Unified Trading</button>
<button class="py-3 text-[#8b8f9c]">Inverse</button>
</div>

<!-- My Banks Section - Professional -->
<div class="p-4">
<div class="flex justify-between items-center"><h2 class="text-[14px] font-bold">My Banks & Wallets</h2><span class="text-[11px] text-[#8b8f9c]">6 Accounts • Hide 0 Balance</span></div>

<div id="bankList" class="mt-3 space-y-[1px] bg-[#22252e] rounded-lg overflow-hidden border border-[#22252e]">
<!-- Rendered by JS -->
</div>
</div>

<!-- Assets -->
<div class="px-4 pb-24">
<div class="flex justify-between items-center mt-2"><h2 class="text-[13px] font-bold">Assets</h2><span class="text-[11px] text-[#8b8f9c]">Value (BDT) ▼</span></div>
<div class="mt-2 space-y-2">
<div class="bybit-card rounded-lg p-3 flex justify-between"><div class="flex gap-3"><img src="https://cryptologos.cc/logos/tether-usdt-logo.png" class="w-7 h-7"><div><p class="text-[13px] font-medium">USDT</p><p class="text-[11px] text-[#8b8f9c]">Tether</p></div></div><div class="text-right"><p class="text-[13px] font-medium">1,240.50</p><p class="text-[11px] text-[#8b8f9c]">৳ 136,455</p></div></div>
<div class="bybit-card rounded-lg p-3 flex justify-between"><div class="flex gap-3"><div class="w-7 h-7 bg-[#f7931a] rounded-full"></div><div><p class="text-[13px] font-medium">BTC</p><p class="text-[11px] text-[#8b8f9c]">Bitcoin</p></div></div><div class="text-right"><p class="text-[13px] font-medium">0.0124</p><p class="text-[11px] text-[#20b26c]">+2.1%</p></div></div>
</div>
</div>

<!-- Bottom Nav Exact Bybit -->
<div class="fixed bottom-0 w-full bg-[#15181f] border-t border-[#22252e] flex justify-around py-2 text-[10px] text-[#8b8f9c]">
<div class="text-center"><div>◫</div>Home</div><div class="text-center"><div>↗</div>Markets</div><div class="text-center"><div>⇄</div>Trade</div><div class="text-center text-[#f7a600]"><div>◧</div>Assets</div><div class="text-center"><div>☰</div>More</div>
</div>

<script>
let total = 245820;
let banks = [
{name:'BRAC Bank - Savings',num:'***4521',bal:52420,icon:'BRAC',color:'#1a3a8f'},
{name:'Islami Bank Bangladesh',num:'***1023 • Halal',bal:75200,icon:'IBBL',color:'#00824a'},
{name:'Dutch-Bangla Bank',num:'***8890',bal:18500,icon:'DBBL',color:'#c4122e'},
{name:'City Bank - Current',num:'***3341',bal:34000,icon:'CITY',color:'#e85d04'},
{name:'bKash Personal',num:'01*** 556677',bal:12700,icon:'bK',color:'#e2136e'},
{name:'Nagad Personal',num:'01*** 556677',bal:8500,icon:'NG',color:'#f15a22'},
];
function render(){
let html=''; banks.forEach(b=>{
html+=`<div class="bg-[#15181f] p-3 flex justify-between items-center hover:bg-[#1a1e29] cursor-pointer"><div class="flex gap-3 items-center"><div class="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold text-white" style="background:${b.color}">${b.icon}</div><div><p class="text-[13px] font-medium">${b.name}</p><p class="text-[11px] text-[#8b8f9c]">${b.num} • Available</p></div></div><div class="text-right"><p class="text-[13px] font-medium">৳ ${b.bal.toLocaleString('en-BD')}</p><p class="text-[11px] text-[#8b8f9c]">$ ${(b.bal/110).toFixed(2)}</p></div></div>`;
});
document.getElementById('bankList').innerHTML=html;
document.getElementById('totalEq').innerText='৳ '+total.toLocaleString('en-BD',{minimumFractionDigits:2});
}
function action(t){
let m=t.toUpperCase(); let toast=document.createElement('div'); toast.className='fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#f7a600] text-black px-4 py-2 rounded-full text-[12px] font-bold z-50'; toast.innerText=m+' - Coming Soon • Demo'; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2000);
}
render();
</script>
</body>
</html>
